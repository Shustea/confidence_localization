train_path: "/workspaces/confidence_localization/data/lab/data/processed/1spk_6pink_snr20dB_5ch/train/"
val_path: "/workspaces/confidence_localization/data/lab/data/processed/1spk_6pink_snr20dB_5ch/validation/"
test_path: "/workspaces/confidence_localization/data/lab/data/processed/1spk_6pink_snr20dB_5ch/test/"
rir_bank_path: "/workspaces/confidence_localization/data/lab/data/interim/rir_bank/"
target_path: "/workspaces/confidence_localization/data/lab/data/processed/1spk_6pink_snr20dB_5ch/target/"
wav_path: "/workspaces/confidence_localization/data/lab/data/raw/WSJ0_raw/"
log_dir: "/workspaces/confidence_localization/logs/DOAMAMBA"
save_dir: "/workspaces/confidence_localization/models/"

default_gpu : 5

resume_from_checkpoint: False

train_size : 5400
val_size : 600

batch_size: 16
num_workers: 8

preprocessed_data_flag : True

num_noise_sources : 6

pre_speech_noise_time : 1
max_num_of_speakers : 1
delete_all_samples_flag: False
sample_length_secs: 5
min_sep : 25
# possible_heights: [1.65, 1.675, 1.7, 1.725, 1.75, 1.775, 1.8, 1.825, 1.85]
# possible_heights: [1.75]
room_dim: [5, 5, 2.6]
receivers_coords:
  - [2.500, 2.500, 0.750]
  - [2.550, 2.500, 0.750]
  - [2.500, 2.550, 0.750]
  - [2.450, 2.500, 0.750] 
  - [2.500, 2.450, 0.750]   

J : 1 #amount of pink noise sources

src_height : 1.75
source_radius: 1.825  # m, midpoint of data_helpers.generate_speaker_sample U(1.5, 2.15); used only by the room-geometry validation plot

sound_velocity: 340
hop : 32
order : -1
beta : 0.34
nsample: 2048
p_silence: 0.0
p_one: 1
p_movement : 0.5
dominance_threshold : 0.6
min_overlap : 0.3
max_overlap : 0.9
snr_db : 20

# Per-sample domain randomization applied during synthetic data generation.
# The static room_dim / receivers_coords / beta above are kept as fallbacks
# (and for the validation room-geometry plot); when mix_signal runs it samples
# fresh values from these ranges and overrides args.* on a shallow copy.
data_randomization:
  room_w_range: [3.0, 8.0]         # m
  room_d_range: [3.0, 8.0]         # m
  room_h_range: [2.4, 3.2]         # m
  beta_range: [0.3, 0.6]           # wall reflection coefficient (0=anechoic, 1=fully reflective)
  array_centroid_margin: 0.5       # m from each wall
  array_yaw_range: [0.0, 6.283185307179586]   # 2π
  array_height_range: [0.7, 1.1]   # m, mic-array centroid z
  source_radius_margin: 0.3        # m, source-to-wall margin (keeps source off walls)
  source_min_dist: 1.5             # m, min source-to-array distance (far-field guard)
  source_height_range: [1.6, 1.9]  # m, source z

recivers_num : 5

fs: 16000
nfft : 1024
win_len : 8
overlap : 0.75
exp_window_smoothing : 0.9

# RTF noise-covariance estimation in estimate_rtf:
#   prefix  — legacy: first pre_speech_noise_time seconds are noise, dropped
#             from the signal. Correct for the synthetic generator only.
#   energy  — pick the lowest-energy frames anywhere as the noise reference and
#             keep ALL frames as signal. Robust for real RealMAN/LOCATA data.
# The real-data cache builders override this to "energy"; synthetic preprocess
# leaves it at the default below.
rtf_noise_mode: prefix
rtf_noise_percentile: 0.15   # energy mode: fraction of lowest-energy frames used as noise

eps: 1e-6

# Which architecture build_model() instantiates. One of:
#   doamamba | gcc_mamba | gcc_med | gcc_kalman | rtf_mamba
model_type : doamamba

input_dim : 1024
d_model : 4
freq_dim : 1024
time_dim : 188
hidden_dim : 128
conv_dim : 4
layers : [2, 4, 4, 4]
res_alpha : 0.1
log_var_weight : 1
# log_std head output bounds (sigma = exp(log_std)); replaces the old fixed
# Tanh range of [-1, 1]. [-4, 1.5] -> sigma in ~[1deg, 256deg].
log_std_min : -4.0
log_std_max : 1.5
# Output head over the full (freq_dim x d_model) per-frame REIR feature.
# Replaces the old d_model->1 channel collapse. head_in = freq_dim * d_model.
head_hidden : 256
head_dropout : 0.1

# --- GCC / new-model knobs --------------------------------------------------
# Framed GCC-PHAT front-end (gcc_phat_frames). n_lags is the cropped, centred
# TDOA window in samples (odd); ±20 covers the RealMAN array's physical range.
gcc:
  n_lags : 41
# gcc_mamba reuses the DOAMAMBA backbone with channel axis = mic pairs and freq
# axis = n_lags. Override layers/n_lags here independently of the RTF model.
gcc_mamba:
  n_lags : 41
  layers : [2, 4, 4, 4]
# gcc_med / gcc_kalman: same model, smoothing the predicted DOA track at eval.
gcc_med:
  window : 5            # sliding-window median length (odd)
gcc_kalman:
  q : 1e-3             # constant-velocity process-noise scale
  r : 5e-2             # azimuth measurement variance
# rtf_mamba: peak-feature model over the cached REIR; Mamba in the last layer.
rtf_mamba:
  interp : parabolic   # parabolic | sinc  (sub-sample peak refinement)
  sinc_os : 8          # sinc upsampling factor (interp=sinc only)
  expand : 2

lr : 5e-4
weight_decay: 1e-5
epochs: 300
regularization_constant : 1e-6
temporal_reg_factor : 1e-4

classification : False
logvar_confidence_on_noise: False
# nnl_func : 'von_mises'
nnl_func : 'gaussian'
error_bound_on_mse : 180


ar_coef : 0.9
ar_order : 1

initial_warmup : 0
warmup : 300

noise_beta : 0

# Optional roots for external datasets (only used if data.<stage>.source is set to one of them).
realman_root: "/workspaces/confidence_localization/data/lab/data/raw/RealMAN"
locata_root: "/workspaces/confidence_localization/data/lab/data/raw/locata"
realman_target: "/workspaces/confidence_localization/data/lab/data/processed/RealMAN"
locata_target: "/workspaces/confidence_localization/data/lab/data/processed/LOCATA"
# Cropped GCC-PHAT cache (built by data/build_gcc_cache_splits.py) for the
# gcc_* models. Same train/val/eval split layout as realman_target.
realman_gcc_target: "/workspaces/confidence_localization/data/lab/data/processed/RealMAN_gcc"

# Energy-based VAD config (used by the realtime RealMAN/LOCATA dataloader paths).
# Omit / comment this whole block to disable VAD (datasets fall back to all-ones).
vad:
  alpha: 4          # speech threshold = alpha * adaptive noise floor
  hangover_ms: 150  # propagate speech-flag forward for this many ms
  hop_ms: 10
  frame_ms: 20
  win_sec: 1        # noise-floor adaptation window

# Loader defaults shared by every stage when no per-stage override is set.
# Stage-level overrides go in data.<stage>.loader; the dataloader walks:
#     data.<stage>.loader.<key>  →  <key> at config root  →  built-in default
loader_defaults:
  batch_size: ${batch_size}
  num_workers: ${num_workers}
  pin_memory: true

# Per-source loader defaults — paste these under data.<stage>.loader when you
# switch sources. The dataloader doesn't auto-pick them (it only reads
# data.<stage>.loader); they live here as the documented values to copy in.
loader_per_source:
  synthetic:
    batch_size: ${batch_size}          # 8 by default
    num_workers: ${num_workers}
    pin_memory: true
  realman:
    batch_size: 4                       # realtime: variable-length wav, can't stack
    num_workers: 0                      # soundfile + python loaders, low parallelism
    pin_memory: true
  locata:
    batch_size: 1                       # single recording per dataset
    num_workers: 0
    pin_memory: true
  gcc:
    batch_size: ${batch_size}           # cached fixed-length GCC features stack fine
    num_workers: ${num_workers}
    pin_memory: true

# Per-stage dataset dispatch. ``source`` selects the dataset; the matching sub-block
# below it gives the dataset-specific settings (including its own target sample
# length). To override loader settings, edit ``data.<stage>.loader`` directly or
# pass ``data.train.loader.batch_size=1`` on the CLI when switching to realman.
data:
  train:
    source: realman                     # synthetic | realman | locata | gcc — only knob to flip
    loader: ${loader_per_source.${data.train.source}}   # auto-tracks source
    synthetic:
      root: ${train_path}
    realman:
      root: ${realman_root}
      split: train
      mode: moving
      use_noisy: true
      channels: [0, 3, 5, 7, 1]
      every_nth: 1
      max_items: null
      feature_mode: cached              # realtime | cached
      cache_root: "${realman_target}/train"
      target_duration_sec: 8            # RealMAN default sample length (seconds)
    gcc:                                # GCC-PHAT feature source for the gcc_* models
      root: ${realman_root}
      split: train
      mode: moving
      use_noisy: true
      channels: [0, 3, 5, 7, 1]
      every_nth: 1
      max_items: null
      feature_mode: cached              # realtime | cached
      cache_root: "${realman_gcc_target}/train"
      target_duration_sec: 8
    locata:
      root: ${locata_root}
      split: dev
      task: 1
      recording: 1
      array: eigenmike
      channels: [4, 10, 6, 1, 19]
      source_name: null
      feature_mode: realtime
      cache_root: "${locata_target}/train"
      target_duration_sec: 8            # LOCATA default sample length (seconds)
  val:
    source: realman
    loader: ${loader_per_source.${data.val.source}}
    synthetic:
      root: ${val_path}
    realman:
      root: ${realman_root}
      split: val
      mode: moving
      use_noisy: true
      channels: [0, 3, 5, 7, 1]
      every_nth: 1
      max_items: null
      feature_mode: cached
      cache_root: "${realman_target}/val"
      target_duration_sec: 8
    gcc:
      root: ${realman_root}
      split: val
      mode: moving
      use_noisy: true
      channels: [0, 3, 5, 7, 1]
      every_nth: 1
      max_items: null
      feature_mode: cached
      cache_root: "${realman_gcc_target}/val"
      target_duration_sec: 8
    locata:
      root: ${locata_root}
      split: dev
      task: 1
      recording: 1
      array: eigenmike
      channels: [4, 10, 6, 1, 19]
      source_name: null
      feature_mode: realtime
      cache_root: "${locata_target}/val"
      target_duration_sec: 8
  eval:
    source: realman
    loader: ${loader_per_source.${data.eval.source}}
    realman:
      root: ${realman_root}
      split: test                       # RealMAN TEST partition, held out from train/val
      mode: moving
      use_noisy: true
      channels: [0, 3, 5, 7, 1]
      every_nth: 1
      max_items: null
      feature_mode: cached
      cache_root: "${realman_target}/eval"
      target_duration_sec: 8
    gcc:
      root: ${realman_root}
      split: test
      mode: moving
      use_noisy: true
      channels: [0, 3, 5, 7, 1]
      every_nth: 1
      max_items: null
      feature_mode: cached
      cache_root: "${realman_gcc_target}/eval"
      target_duration_sec: 8
    locata:
      root: ${locata_root}
      split: eval
      task: 1
      recording: 1
      array: eigenmike
      channels: [4, 10, 6, 1, 19]
      source_name: null
      feature_mode: cached
      cache_root: "${locata_target}/eval"
      target_duration_sec: 8
